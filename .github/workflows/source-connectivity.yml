name: Brazilian SeedLink connectivity

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/source_connectivity_probe.py'
      - 'backend/config.py'
      - '.github/workflows/source-connectivity.yml'
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: write

concurrency:
  group: sdp-source-connectivity-report
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SDP_ENABLE_USP: 'true'
      SDP_ENABLE_ON: 'true'
      SDP_ENABLE_UNB: 'true'
      SDP_ENABLE_UFRN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe candidate Brazilian SeedLink servers
        run: python tools/source_connectivity_probe.py
      - name: Commit latest connectivity report
        run: |
          git config user.name "sdp-network-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest-source-connectivity.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update SeedLink source connectivity [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
