name: S.D.P tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'index.html'
      - 'tests/**'
      - 'requirements.txt'
      - 'render.yaml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'index.html'
      - 'tests/**'
      - 'requirements.txt'
      - 'render.yaml'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SDP_ENABLE_USP: 'false'
      SDP_ENABLE_ON: 'false'
      SDP_ENABLE_UNB: 'false'
      SDP_ENABLE_UFRN: 'false'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend tools
      - run: pytest -q
      - run: node --check web/app.js
      - run: node --check web/runtime-config.js
      - run: node --check web/local-clock.js
