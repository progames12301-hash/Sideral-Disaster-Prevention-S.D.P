name: S.D.P tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SDP_ENABLE_USP: 'false'
      SDP_ENABLE_ON: 'false'
      SDP_ENABLE_UNB: 'false'
      SDP_ENABLE_UFRN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend tools
      - run: pytest -q
