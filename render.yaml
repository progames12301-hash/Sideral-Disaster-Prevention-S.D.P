services:
  - type: web
    name: sideral-disaster-prevention
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SDP_ENABLE_USP
        value: true
      - key: SDP_ENABLE_ON
        value: true
      - key: SDP_ENABLE_UNB
        value: false
      - key: SDP_ENABLE_UFRN
        value: false
      - key: SDP_MIN_STATIONS
        value: 3
      - key: SDP_THREE_COMPONENT_STREAMS
        value: true
      - key: SDP_PHASE_PICKER
        value: stalta
      - key: SDP_EEW_MAX_PICK_LATENCY
        value: 8
      - key: SDP_SEEDLINK_STALL_SECONDS
        value: 120
      - key: SDP_STATION_FRESH_SECONDS
        value: 45
      - key: SDP_CATALOG_URL
        value: https://www.moho.iag.usp.br/fdsnws/event/1/query
